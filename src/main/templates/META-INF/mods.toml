modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/DrimoZ/ContiguousStorage/issues"

# Needed on both sides since the trims: a client without the mod is refused by the registry check
# (MANUAL_TESTS.md §5).
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
displayURL = "https://github.com/DrimoZ/ContiguousStorage"
logoFile = "logo.png"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The mod only ever talks to Functional Storage's linking API (addConnectedDrawers, controllerPos).
# FS versions read "1.20.1-1.2.14": a bare [1.2.14,) would let any FS for 1.20.1 through.
[[dependencies.${mod_id}]]
modId = "functionalstorage"
mandatory = true
versionRange = "[1.20.1-1.2.14,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "titanium"
mandatory = true
versionRange = "[3.8.35,)"
ordering = "AFTER"
side = "BOTH"
