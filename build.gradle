plugins {
    id 'java-library'
    // Pinned to the version Functional Storage itself builds with.
    id 'net.neoforged.moddev' version '2.0.75'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Runs every @GameTest headlessly and exits non-zero if any fails.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (Titanium)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // Functional Storage publishes to no public maven; Modrinth serves it by version number.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Hard dependencies, never bundled.
    implementation "com.hrznstudio:titanium:${titanium_version}"
    implementation "maven.modrinth:functional-storage:${functionalstorage_version}"

    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // Game test 10: an addon drawer conducts and links. Immaterial Drawers is built next door and
    // not on a maven; without its jar the run still works and only that (non-required) test fails.
    var immaterialDrawers = file("../ImmaterialDrawers/build/libs/immaterialdrawers-${immaterialdrawers_version}.jar")
    if (immaterialDrawers.exists()) {
        runtimeOnly files(immaterialDrawers)
    }
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}
