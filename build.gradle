plugins {
    id 'java-library'
    // ModDevGradle's Forge flavour: Forge 47 for 1.20.1, with the same layout as the NeoForge branches.
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// src/gametest: a dev-only mod present in dev runs, never in the jar - see legacyForge.mods. Its data
// (test tags) and the in-game scenario driver (./gradlew runClient -Pscenario, MANUAL_TESTS.md).
sourceSets { gametest {} }
configurations { gametestImplementation.extendsFrom implementation }
// src/nomod does not exist: an empty source set whose classpath has the dependencies but not this
// mod, for the clientWithoutMod run.
sourceSets { nomod {} }
configurations {
    nomodImplementation.extendsFrom implementation
    nomodRuntimeOnly.extendsFrom runtimeOnly
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            // Its own folder: a world opened in another version cannot be opened in this one again.
            gameDirectory = project.file('run-1.20.1')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // -Pscenario: opens the world "scenario" and lets the dev-only driver play the manual
            // test scenario by itself (src/gametest, ClientScenario).
            if (project.hasProperty('scenario')) {
                programArguments.addAll '--quickPlaySingleplayer', 'scenario'
                systemProperty 'contiguousstorage.scenario', 'true'
            }
        }
        // A client with Functional Storage but not this mod, joining runServer: it must be turned
        // away cleanly, since the trims are registered (MANUAL_TESTS.md).
        clientWithoutMod {
            client()
            gameDirectory = project.file('run-nomod')
            sourceSet = sourceSets.nomod
            loadedMods = []
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
        }
        server {
            server()
            gameDirectory = project.file('run-1.20.1')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        // Runs every @GameTest headlessly and exits non-zero if any fails.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Dev runs only, never the jar: data the game tests need, such as copper in the conductor
        // tag. A mod of its own so its tag merges with the shipped one - two files at one path in a
        // single mod would shadow each other instead.
        contiguousstorage_testdata {
            sourceSet(sourceSets.gametest)
        }
    }
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.nomod)
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (Titanium)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // Functional Storage publishes to no public maven; Modrinth serves it by version number.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Hard dependencies, never bundled. mod*: remapped from Forge's production names to dev names.
    modImplementation "com.hrznstudio:titanium:${titanium_version}"
    modImplementation "maven.modrinth:functional-storage:${functionalstorage_version}"

    modRuntimeOnly "maven.modrinth:jade:${jade_version}"
    // Dev run only: the scenario moves a linked drawer with a Create contraption. -PnoCreate leaves it out.
    if (!project.hasProperty('noCreate')) {
        modRuntimeOnly "maven.modrinth:create:${create_version}"
    }

    gametestImplementation sourceSets.main.output
}

// Expand gradle.properties into mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs << '-Xlint:deprecation'
}
