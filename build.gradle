plugins {
    id 'java-library'
    // Pinned to the version Functional Storage itself builds with.
    id 'net.neoforged.moddev' version '2.0.75'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// src/gametest: a dev-only mod present in dev runs, never in the jar - see neoForge.mods. Its data
// (test tags) and the in-game scenario driver (./gradlew runClient -Pscenario, MANUAL_TESTS.md).
sourceSets { gametest {} }
configurations { gametestImplementation.extendsFrom implementation }
// src/nomod does not exist: an empty source set whose classpath has the dependencies but not this
// mod, for the clientWithoutMod run.
sourceSets { nomod {} }
configurations {
    nomodImplementation.extendsFrom implementation
    nomodRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // -Pscenario: opens the world "scenario" and lets the dev-only driver play the manual
            // test scenario by itself (src/gametest, ClientScenario).
            if (project.hasProperty('scenario')) {
                programArguments.addAll '--quickPlaySingleplayer', 'scenario'
                systemProperty 'contiguousstorage.scenario', 'true'
            }
            // -Plogo: renders the logo from the real blocks into run/logo/logo.png (LogoRender).
            if (project.hasProperty('logo')) {
                programArguments.addAll '--quickPlaySingleplayer', 'scenario'
                systemProperty 'contiguousstorage.logo', 'true'
            }
        }
        // A client with Functional Storage but not this mod, joining runServer: it must be turned
        // away cleanly, since the trims are registered (MANUAL_TESTS.md).
        clientWithoutMod {
            client()
            gameDirectory = project.file('run-nomod')
            sourceSet = sourceSets.nomod
            loadedMods = []
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Runs every @GameTest headlessly and exits non-zero if any fails.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        // Dev runs only, never the jar: data the game tests need, such as copper in the conductor
        // tag. A mod of its own (lowcodefml, no code) so its tag merges with the shipped one -
        // two files at one path in a single mod would shadow each other instead.
        contiguousstorage_testdata {
            sourceSet(sourceSets.gametest)
        }
    }
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.nomod)
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared (Titanium)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // Functional Storage publishes to no public maven; Modrinth serves it by version number.
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Hard dependencies, never bundled.
    implementation "com.hrznstudio:titanium:${titanium_version}"
    implementation "maven.modrinth:functional-storage:${functionalstorage_version}"

    runtimeOnly "maven.modrinth:jade:${jade_version}"
    // Dev run only: the scenario moves a linked drawer with a Create contraption. -PnoCreate leaves it out.
    if (!project.hasProperty('noCreate')) {
        runtimeOnly "maven.modrinth:create:${create_version}"
    }

    gametestImplementation sourceSets.main.output

    // Game test 10: an addon drawer conducts and links. Immaterial Drawers is built next door and
    // not on a maven; without its jar the run still works and only that (non-required) test fails.
    var immaterialDrawers = file("../ImmaterialDrawers/build/libs/immaterialdrawers-${immaterialdrawers_version}.jar")
    if (immaterialDrawers.exists()) {
        runtimeOnly files(immaterialDrawers)
    }
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}
