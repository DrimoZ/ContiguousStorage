<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Contiguous Storage: five tiles on a 3x3 grid, joined only where they touch. Teal joints are
       the links; the slate tile with the ring is the controller. -->
  <defs>
    <g id="drawer">
      <rect width="112" height="112" rx="16" fill="#D39C5C"/>
      <rect x="14" y="14" width="84" height="84" rx="9" fill="#B9813F"/>
      <rect x="34" y="47" width="44" height="14" rx="7" fill="#22282F"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="104" fill="#22282F"/>
  <!-- joints between touching tiles -->
  <g fill="#4FD1C5">
    <rect x="112" y="192" width="48" height="8" rx="4"/>
    <rect x="192" y="232" width="8" height="48" rx="4"/>
    <rect x="312" y="232" width="8" height="48" rx="4"/>
    <rect x="352" y="312" width="48" height="8" rx="4"/>
  </g>
  <use href="#drawer" x="80" y="80"/>
  <use href="#drawer" x="80" y="200"/>
  <use href="#drawer" x="320" y="200"/>
  <use href="#drawer" x="320" y="320"/>
  <!-- controller -->
  <rect x="200" y="200" width="112" height="112" rx="16" fill="#3D4957"/>
  <circle cx="256" cy="256" r="24" fill="none" stroke="#4FD1C5" stroke-width="10"/>
</svg>
